name: Cold Email Batch — B2B CSR NRW

on:
  # Lunes, miércoles y viernes a 08:00 UTC (= 10:00 CET con DST de mayo)
  schedule:
    - cron: "0 8 * * 1,3,5"

  # Trigger manual — permite dry_run para pruebas
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (true = solo simula, false = envío real)"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]

jobs:
  send-batch:
    name: Enviar cold emails B2B
    runs-on: ubuntu-latest
    timeout-minutes: 90   # 5 emails × 10 min + margen

    steps:
      - name: Trigger batch en Railway
        run: |
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"
          echo "Triggering cold email batch | dry_run=${DRY_RUN}"

          HTTP_CODE=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST https://quetz.org/api/internal/send-cold-batch \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{\"dry_run\": ${DRY_RUN}}" \
            --max-time 30)

          echo "HTTP ${HTTP_CODE}"
          cat /tmp/response.json

          if [ "$HTTP_CODE" != "202" ]; then
            echo "ERROR: endpoint devolvió ${HTTP_CODE}"
            exit 1
          fi
          echo "Batch iniciado en Railway. Progreso via Telegram."

      - name: Verificar estado (3 min después)
        run: |
          echo "Esperando 3 min para que el script arranque..."
          sleep 180

          STATUS=$(curl -s \
            https://quetz.org/api/internal/cold-batch-status \
            --max-time 10)

          echo "$STATUS" | python3 -m json.tool 2>/dev/null || echo "$STATUS"
